[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-generator"
version = "0.1.0"
description = "Generates the Sean12697 GitHub profile README from a template and live data sources."
readme = "docs/GENERATOR.md"
requires-python = ">=3.11"
authors = [{ name = "Sean O'Mahoney", email = "sean@inevitableteam.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
profile-gen = "profile_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
profile_generator = ["demo/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
